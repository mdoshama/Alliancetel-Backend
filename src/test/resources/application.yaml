spring:
  datasource:
    url: jdbc:h2:mem:alliancetel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

alliancetel:
  security:
    # Fast hashing keeps the test suite quick; production uses 12.
    bcrypt-strength: 4
  scheduling:
    max-day-off-requests-per-week: 2
    # Older tests make requests for any week and generate without everyone's request; the tests for these rules
    # switch them on.
    request-window: false
    one-emergency-per-month: false
    require-requests-before-generate: false
    reserve-days-off: false
  demo-data:
    enabled: false
  # The WhatsApp sender is called directly in tests.
  background-jobs: false
