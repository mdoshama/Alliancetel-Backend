# Plain-language messages for request validation. The field name is put in front by GlobalExceptionHandler,
# e.g. "First name is required".
jakarta.validation.constraints.NotBlank.message=is required
jakarta.validation.constraints.NotNull.message=is required
jakarta.validation.constraints.NotEmpty.message=is required
jakarta.validation.constraints.Size.message=must be at most {max} characters
jakarta.validation.constraints.Min.message=must be at least {value}
jakarta.validation.constraints.Max.message=must be at most {value}
jakarta.validation.constraints.Email.message=must be a valid email like name@example.com
jakarta.validation.constraints.Pattern.message=has characters that aren't allowed
