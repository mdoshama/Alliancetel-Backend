# Defaults for local development. Production overrides live in application-prod.yaml
# (activate with SPRING_PROFILES_ACTIVE=prod). Every value can also be set by environment variable.
spring:
  application:
    name: alliancetel-scheduling
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alliancetel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Creates and updates tables to match the entities. See DEPLOYMENT.md before changing.
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-* headers from the reverse proxy (nginx) for client IPs and https links.
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

alliancetel:
  security:
    # Signing key for login tokens. Use a long random value outside local development.
    jwt-secret: ${JWT_SECRET:alliancetel-dev-secret-change-me-in-production-0123456789}
    token-hours: ${TOKEN_HOURS:12}
    # When true, the app refuses to start with the built-in development secret.
    require-strong-secret: false
    # Failed sign-ins allowed per email (and per IP, x4) before a temporary lock.
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    # Temporary passwords (new staff, resets) stop working after this many hours if not changed. 168 = 7 days.
    temporary-password-hours: ${TEMP_PASSWORD_HOURS:168}
    # BCrypt cost for password hashes. Each step doubles the work; 12 takes about 0.25 s per sign-in.
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    # Comma-separated origins allowed to call the API from another domain. Leave empty when the
    # frontend is served through the same domain (the nginx setup in DEPLOYMENT.md).
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap-admin:
    # Used only if no admin can sign in; that account must change this password at first login.
    email: ${ADMIN_EMAIL:admin@alliancetel.example}
    password: ${ADMIN_PASSWORD:ChangeMe123}
  scheduling:
    # How many day-off requests one employee may have (pending + approved) in a single Mon-Sun week
    max-day-off-requests-per-week: ${MAX_DAY_OFF_PER_WEEK:2}
    # People ask for next week's days off by the end of Friday (the following week opens on Saturday). Emergency
    # requests skip this; managers entering a request for someone else and admins can make exceptions.
    request-window: ${DAY_OFF_REQUEST_WINDOW:true}
    # One emergency request per person per calendar month.
    one-emergency-per-month: ${ONE_EMERGENCY_PER_MONTH:true}
    # The week can't be generated until everyone has a day-off request in (or was given a day off).
    require-requests-before-generate: ${REQUIRE_REQUESTS_BEFORE_GENERATE:true}
    # When a week opens for requests, everyone gets their usual days off reserved (1 for 6-day, 2 for 5-day staff);
    # asking for another day swaps automatically when the stores can cover it.
    reserve-days-off: ${RESERVE_DAYS_OFF:true}
    # The company's time zone, for "today" and the Friday deadline.
    zone: ${SCHEDULING_ZONE:America/Los_Angeles}
  # Birthday reminder emails to admins (everyone) and managers (their area), from each employee's birth date.
  birthdays:
    reminders-enabled: ${BIRTHDAY_REMINDERS_ENABLED:true}
    # Days before the birthday to send a reminder; 0 = on the day itself.
    remind-days-before: ${BIRTHDAY_REMIND_DAYS:7,0}
    # The company's time zone, for "today" and when the daily check runs (hourly 8am-6pm, at most one email a day).
    zone: ${BIRTHDAY_ZONE:America/Los_Angeles}
  demo-data:
    # Seeds sample areas/stores/staff into an empty database; sample accounts use the password Welcome123
    enabled: ${DEMO_DATA:true}
  # Public address of the web app, used for links in WhatsApp messages, e.g. https://alliancetel.com
  app-url: ${APP_URL:}
  # WhatsApp schedule messages (Meta WhatsApp Cloud API). Until enabled with a phone number ID and access token,
  # messages are only recorded on the Messages page. See README, "WhatsApp messages".
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    # meta (WhatsApp Cloud API, the settings above) or twilio (uses the Twilio account below, TWILIO_ACCOUNT_SID and
    # TWILIO_AUTH_TOKEN). With Twilio's WhatsApp Sandbox, each person first sends the join phrase to the Sandbox number.
    provider: ${WHATSAPP_PROVIDER:meta}
    twilio:
      from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
      sandbox-join: ${TWILIO_WHATSAPP_SANDBOX_JOIN:}
      # Approved Twilio Content templates (HX…), needed to message people outside WhatsApp's 24-hour window.
      content:
        week-published: ${TWILIO_WA_CONTENT_WEEK_PUBLISHED:}
        week-changed: ${TWILIO_WA_CONTENT_WEEK_CHANGED:}
        day-off: ${TWILIO_WA_CONTENT_DAY_OFF:}
        announcement: ${TWILIO_WA_CONTENT_ANNOUNCEMENT:}
    api-version: ${WHATSAPP_API_VERSION:v22.0}
    language: ${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
    template:
      week-published: ${WHATSAPP_TEMPLATE_WEEK_PUBLISHED:schedule_published}
      week-changed: ${WHATSAPP_TEMPLATE_WEEK_CHANGED:schedule_changed}
      day-off: ${WHATSAPP_TEMPLATE_DAY_OFF:day_off_update}
      announcement: ${WHATSAPP_TEMPLATE_ANNOUNCEMENT:team_announcement}
  # Text messages (SMS) through Twilio. Until enabled with an account SID, auth token and a sender (a Twilio number or a
  # Messaging Service), texts are only recorded on the Messages page. People must agree to texts themselves (user menu).
  # US numbers need A2P 10DLC (or toll-free) registration in Twilio first. See README, "Text messages".
  sms:
    enabled: ${SMS_ENABLED:false}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  # Schedule emails through Resend's HTTPS API (Railway blocks SMTP mail on Free/Hobby plans). Until enabled with an
  # API key and a sender, emails are only recorded on the Messages page. See README, "Email and WhatsApp messages".
  email:
    enabled: ${EMAIL_ENABLED:false}
    resend-api-key: ${RESEND_API_KEY:}
    # e.g. AllianceTel <schedule@notifications.yourdomain.com> (a domain verified in Resend)
    from: ${EMAIL_FROM:}
    reply-to: ${EMAIL_REPLY_TO:}
