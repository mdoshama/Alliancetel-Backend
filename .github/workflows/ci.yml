# Runs on every push and pull request: all backend tests, then a check that the Docker image builds.
# Railway deploys separately from the same branch; a red check here means "don't trust this deploy".
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run tests and build the jar
        run: ./mvnw -B verify
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (not pushed)
        run: docker build -t alliancetel-backend:ci .
